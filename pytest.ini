[pytest]
# The package lives under src/ (D1), which is not on sys.path by default.
# Without this, `pytest` from the repo root fails on `from newsrec... import`
# and every contributor has to remember PYTHONPATH=src - the same class of
# "works only from the right directory" bug the Q1.5 rebuild script already hit
# (see PROGRESS.md's error log, 2026-08-23).
pythonpath = src
testpaths = tests
