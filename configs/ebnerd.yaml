# Raw EB-NeRD root - contains articles.parquet, train/, and validation/
# subdirectories. Trains on ebnerd_large, sampled by user below.
raw_root: data/raw/ebnerd/ebnerd_large

# Keep EB-NeRD users with user_id % 100 < user_sample_pct.
# Must be an int in 1..100; delete the key to keep every user.
# 5 -> 48,666 users, 597,348 train + 622,398 validation impressions.
user_sample_pct: 5

# Unlabeled ebnerd_testset bundle for RecSys 2024 Challenge benchmark evaluation
# (125,541 articles, 13,536,710 impressions, 807,677 user histories).
test_root: data/raw/ebnerd/ebnerd_testset/ebnerd_testset
