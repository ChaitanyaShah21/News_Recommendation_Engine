# Raw EB-NeRD root - must contain articles.parquet, train/, and validation/
# subdirectories. A2 (D33) trains on ebnerd_large, sampled by user below.
# A1 used ebnerd_demo here; its numbers reproduce from tag phase-5-complete.
raw_root: data/raw/ebnerd/ebnerd_large

# D33: keep EB-NeRD users with user_id % 100 < user_sample_pct.
# Must be an int in 1..100; delete the key to keep every user.
# 5 -> 48,666 users, 597,348 train + 622,398 validation impressions.
user_sample_pct: 5

# Phase 5 / Q5 only. The unlabeled ebnerd_testset bundle the RecSys 2024
# leaderboard scores against - 125,541 articles, 13,536,710 impressions,
# 807,677 users' history. Note the doubled directory name: the zip extracts
# to ebnerd_testset/ebnerd_testset/. Same reasoning as mind.yaml's test_root -
# this is not the "test" split of the feature store. Never sampled.
test_root: data/raw/ebnerd/ebnerd_testset/ebnerd_testset
