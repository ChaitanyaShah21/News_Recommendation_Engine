# Raw MIND-small root - contains MINDsmall_train/ and MINDsmall_dev/
# subdirectories (each with news.tsv, behaviors.tsv).
# scripts/build_pipeline.py validates the presence of these files.
raw_root: data/raw/mind

# Unlabeled MINDlarge_test bundle for competition/benchmark evaluation
# (120,961 articles, 2,370,727 impressions).
# Kept as a separate key from raw_root because this is an external test set.
test_root: data/raw/mind/MINDlarge_test
